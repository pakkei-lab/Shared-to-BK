<!doctype html><html lang="zh-HK"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>名古屋＋大阪六日五夜・2人版</title><style>:root{--n:#08172d;--b:#2563eb;--g:#10b981;--bg:#f3f6fb;--m:#667085}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"PingFang HK","Noto Sans TC",sans-serif;color:#101828}.hero{padding:calc(34px + env(safe-area-inset-top)) 20px 30px;background:linear-gradient(145deg,#071326,#17345e);color:#fff}.wrap{max-width:760px;margin:auto}.tag{display:inline-block;padding:6px 10px;border:1px solid #ffffff33;border-radius:99px;font-size:12px}.hero h1{font-size:34px;margin:22px 0 8px}.hero p{color:#ced9e9;line-height:1.6}.facts{display:grid;grid-template-columns:1fr 1fr;gap:10px}.fact{padding:13px;background:#ffffff12;border:1px solid #ffffff18;border-radius:16px}.fact small{display:block;color:#9eb0ca;margin-bottom:5px}.nav{position:sticky;top:0;background:#f3f6fbe8;backdrop-filter:blur(14px);padding:10px;z-index:5}.tabs{max-width:760px;margin:auto;padding:4px;background:#e4e9f1;border-radius:15px;display:grid;grid-template-columns:repeat(4,1fr);gap:4px}.tab{border:0;background:transparent;padding:9px;border-radius:11px;font-weight:700;color:#667085}.tab.on{background:white;color:#101828}.main{max-width:760px;margin:auto;padding:22px 14px 60px}.panel{display:none}.panel.on{display:block}.title h2{margin:0}.title p{margin:4px 0 15px;color:var(--m);font-size:13px}.stack{display:grid;gap:13px}.card{background:white;border-radius:22px;padding:16px;box-shadow:0 10px 30px #0f172a10}.day h3{margin:0 0 5px}.date{display:inline-block;background:var(--b);color:white;border-radius:10px;padding:5px 9px;font-size:12px;margin-bottom:10px}.meta{color:var(--m);font-size:13px;line-height:1.6}.day ul{padding-left:20px;margin:11px 0 0;line-height:1.7;font-size:14px}.tip{margin-top:11px;padding:10px;border-radius:13px;background:#fff8e7;color:#7a4b00;font-size:13px}.hotel .label{display:inline-block;padding:4px 8px;border-radius:99px;background:#eaf2ff;color:#1d4ed8;font-size:11px;font-weight:800}.hotel h3{font-size:17px;margin:9px 0}.price{font-size:20px;font-weight:900}.hotel p{color:var(--m);font-size:14px;line-height:1.6}.row{display:flex;justify-content:space-between;gap:14px;padding:14px 0;border-bottom:1px solid #ecf0f5;font-size:14px}.row span{color:var(--m)}.total{margin-top:14px;background:var(--n);color:white;border-radius:20px;padding:18px}.total strong{display:block;font-size:24px;color:#7ef2b0;margin-top:5px}.booking{display:flex;gap:12px}.num{width:38px;height:38px;border-radius:13px;background:var(--n);color:white;display:grid;place-items:center;font-weight:900;flex:none}.booking h3{margin:1px 0 5px;font-size:15px}.booking p{margin:0;color:var(--m);font-size:13px;line-height:1.5}@media(min-width:600px){.hero h1{font-size:42px}.main{padding-left:20px;padding-right:20px}}</style></head><body><header class="hero"><div class="wrap"><span class="tag">2026 日本之旅・2人版</span><h1>名古屋＋大阪 六日五夜</h1><p>香港飛名古屋入、大阪返香港；名古屋三晚、大阪兩晚，免卻大阪折返名古屋。</p><div class="facts"><div class="fact"><small>日期</small><b>10月9–14日</b></div><div class="fact"><small>預計兩人總額</small><b>HK$15,300–24,100</b></div></div></div></header><div class="nav"><div class="tabs"><button class="tab on" data-p="trip">行程</button><button class="tab" data-p="hotel">酒店</button><button class="tab" data-p="budget">預算</button><button class="tab" data-p="book">預訂</button></div></div><main class="main"><section id="trip" class="panel on"><div class="title"><h2>最新行程</h2><p>Open-jaw 路線：香港 → 名古屋 → 大阪 → 香港</p></div><div class="stack" id="days"></div></section><section id="hotel" class="panel"><div class="title"><h2>酒店比較</h2><p>2 人 1 房，每晚預算 HK$800–1,500。</p></div><div class="stack" id="hotels"></div></section><section id="budget" class="panel"><div class="title"><h2>兩人預算</h2><p>不含購物；實際機票與酒店價格以預訂時為準。</p></div><div class="card" id="rows"></div><div class="total">預計 2 人總額<strong>HK$15,300–24,100</strong></div></section><section id="book" class="panel"><div class="title"><h2>預訂優先次序</h2><p>先處理門票、假期交通與住宿。</p></div><div class="stack" id="books"></div></section></main><script>
const days=[['10月9日・星期五','香港 → 名古屋','中部國際機場 → 名古屋站',['抵達後入住名古屋站附近酒店','下午遊名古屋城、榮、大須商店街','住宿：名古屋第 1 晚'],'首日預留入境及航班延誤時間。'],['10月10日・星期六','吉卜力公園全日遊','東山線 → 藤丘 → Linimo',['建議購買 O-Sanpo Premium','按大倉庫指定入場時間安排行程','住宿：名古屋第 2 晚'],'門票不可即場購買。'],['10月11日・星期日','白川鄉全日遊','名鐵巴士中心 ↔ 白川鄉',['預訂早班去程及下午回程','遊城山展望台、和田家、合掌村','住宿：名古屋第 3 晚'],'三連休期間應同時預訂來回座位。'],['10月12日・星期一／日本假期','名古屋 → 大阪','名古屋 → 新大阪 → 難波',['退房後乘新幹線單程前往新大阪','大阪酒店寄存行李','下午大阪城；晚上心齋橋及道頓堀','住宿：大阪第 1 晚'],'只需購買單程新幹線；假期建議指定席。'],['10月13日・星期二','大阪深度遊','難波 → 黑門市場 → 新世界 → 梅田',['上午黑門市場、日本橋或四天王寺','下午新世界、通天閣','傍晚梅田購物或空中庭園夜景','住宿：大阪第 2 晚'],'不需要折返名古屋。'],['10月14日・星期三','大阪半日 → 香港','難波 → 關西國際機場 → 香港',['上午中之島、天王寺或難波購物','回酒店取行李及午餐','乘南海電鐵往關西機場','大阪飛返香港'],'建議選下午 3 時後航班，起飛前約 3 小時到機場。']];
const hotels=[['名古屋首選','Mitsui Garden Hotel Nagoya Premier','HK$1,050–1,450／晚','地下通道連接名古屋站，交通與住宿質素平衡。'],['名古屋性價比','Meitetsu Inn Nagoyaeki Shinkansenguchi','HK$800–1,100／晚','近太閤通口，新幹線及市內交通方便。'],['大阪首選','Hotel Keihan Namba Grande','HK$900–1,300／晚','近南海難波站，往道頓堀及關西機場方便。'],['大阪性價比','Sotetsu Fresa Inn Osaka Namba','HK$800–1,100／晚','難波站附近，適合控制住宿預算。'],['大阪舒適選擇','Hotel Monterey Grasmere Osaka','HK$1,100–1,500／晚','鄰近 JR 難波及機場巴士，位置方便。']];
const budget=[['2 人多程機票','HK$5,000–8,000'],['名古屋酒店・3 晚','HK$2,400–4,500'],['大阪酒店・2 晚','HK$1,600–3,000'],['名古屋→新大阪單程新幹線','HK$600–700'],['白川鄉巴士來回','HK$800–960'],['吉卜力 Premium 門票','約 HK$788＋出票費'],['機場及市內交通','HK$700–950'],['2 人膳食','HK$3,000–5,000']];
const books=[['吉卜力公園門票','確認 10月10日 Premium 門票及大倉庫入場時間。'],['白川鄉來回巴士','同時預訂 10月11日去程及回程。'],['多程機票','香港→名古屋；10月14日大阪關西→香港。'],['名古屋酒店','10月9日入住、12日退房，共 3 晚。'],['大阪酒店','10月12日入住、14日退房，共 2 晚；首選難波。'],['單程新幹線','10月12日名古屋→新大阪；假期提早劃位。']];
days.forEach(x=>daysEl=document.querySelector('#days').insertAdjacentHTML('beforeend',`<article class="card day"><span class="date">${x[0]}</span><h3>${x[1]}</h3><div class="meta">交通：${x[2]}</div><ul>${x[3].map(y=>`<li>${y}</li>`).join('')}</ul><div class="tip">提示：${x[4]}</div></article>`));
hotels.forEach(x=>document.querySelector('#hotels').insertAdjacentHTML('beforeend',`<article class="card hotel"><span class="label">${x[0]}</span><h3>${x[1]}</h3><div class="price">${x[2]}</div><p>${x[3]}</p></article>`));budget.forEach(x=>document.querySelector('#rows').insertAdjacentHTML('beforeend',`<div class="row"><span>${x[0]}</span><b>${x[1]}</b></div>`));books.forEach((x,i)=>document.querySelector('#books').insertAdjacentHTML('beforeend',`<article class="card booking"><div class="num">${i+1}</div><div><h3>${x[0]}</h3><p>${x[1]}</p></div></article>`));document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{document.querySelectorAll('.tab,.panel').forEach(x=>x.classList.remove('on'));t.classList.add('on');document.querySelector('#'+t.dataset.p).classList.add('on')});
</script></body></html>
